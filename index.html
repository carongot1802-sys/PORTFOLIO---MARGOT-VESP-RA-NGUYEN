<style>
:root{--bg:#f4f6ea;--ink:#2f3b25;--soft:#5d6b4c;--matcha:#8aa36a;--matcha-d:#5f7a43;--mist:#dfe8c8;--blush:#f2dfe0;--card:rgba(255,255,255,.62);--line:rgba(95,122,67,.22)}
@media (prefers-color-scheme:dark){:root{--bg:#1d2418;--ink:#eef2dd;--soft:#b6c39b;--matcha:#a5bf80;--matcha-d:#c6dba0;--mist:#2c3a22;--blush:#3a2d33;--card:rgba(40,52,32,.6);--line:rgba(190,215,150,.2)}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',system-ui,sans-serif;font-weight:300;color:var(--ink);background:var(--bg);line-height:1.75;min-height:100vh;overflow-x:hidden}
/* dreamy background: drifting blurred blobs (+ optional background photo) */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:55vw;height:55vw;background:var(--mist);top:-15vw;left:-10vw}
.bg i:nth-child(2){width:45vw;height:45vw;background:var(--blush);bottom:-12vw;right:-8vw;animation-delay:-8s}
.bg i:nth-child(3){width:35vw;height:35vw;background:#c5d9a0;top:40%;left:45%;opacity:.4;animation-delay:-14s}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;filter:blur(6px)}
@keyframes drift{to{transform:translate(6vw,4vw) scale(1.12)}}
.wrap{max-width:1000px;margin:0 auto;padding:28px 22px 70px}
/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:500;letter-spacing:.04em;color:var(--matcha-d)}
.lang{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px)}
.lang button{border:0;background:none;font:inherit;font-size:.82rem;padding:5px 13px;border-radius:99px;cursor:pointer;color:var(--soft);transition:.3s}
.lang button.on{background:var(--matcha);color:#fff}
/* hero */
.hero{text-align:center;padding:54px 0 30px}
.hero h1{font-family:'Montserrat',sans-serif;font-weight:300;font-size:clamp(2rem,5.6vw,3.6rem);line-height:1.15;letter-spacing:-.01em}
.hero p{font-family:'Montserrat',sans-serif;font-style:italic;font-weight:300;font-size:1.05rem;color:var(--soft);margin-top:12px}
/* tabs */
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:26px 0 34px;position:sticky;top:10px;z-index:5}
nav button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);color:var(--soft);padding:8px 18px;border-radius:99px;cursor:pointer;transition:all .35s ease}
nav button:hover{transform:translateY(-2px);color:var(--ink)}
nav button.on{background:var(--matcha);border-color:var(--matcha);color:#fff;box-shadow:0 8px 22px -8px var(--matcha-d)}
/* panels with smooth switch */
.panel{display:none;opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease}
.panel.show{display:block}
.panel.in{opacity:1;transform:none}
h2{font-family:'Montserrat',sans-serif;font-weight:500;font-size:1.6rem;margin-bottom:20px;color:var(--matcha-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 26px;backdrop-filter:blur(12px);margin-bottom:18px}
.card h3{font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:500;line-height:1.3}
.meta{font-size:.82rem;color:var(--matcha-d);margin:2px 0 8px}
.card p{font-size:.94rem;color:var(--soft)}
a{color:var(--matcha-d)}
.btn{display:inline-block;margin-top:10px;font-size:.85rem;padding:6px 16px;border-radius:99px;border:1px solid var(--matcha);text-decoration:none;transition:.3s}
.btn:hover{background:var(--matcha);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.grid .card{margin:0;padding:0;overflow:hidden;display:flex;flex-direction:column}
.grid .body{padding:6px 22px 22px}
/* IMAGE WITH BLURRED/FADED EDGES — blends into the background */
.fade{-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
.fadeb{-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.ph{display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--soft);border:1.5px dashed var(--matcha);border-radius:22px;background:rgba(138,163,106,.08);padding:18px}
.about{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:34px;align-items:center}
.photo{aspect-ratio:1;width:100%;object-fit:cover}
.about .txt p{font-size:1.02rem;color:var(--ink);margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chips span{font-size:.82rem;padding:4px 14px;border-radius:99px;background:var(--mist);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
.deco{position:absolute;right:-30px;top:120px;width:300px;opacity:.55;pointer-events:none;z-index:-1}
.video{aspect-ratio:16/9;width:100%;border:0;display:block}
footer{text-align:center;font-size:.8rem;color:var(--soft);margin-top:50px}
@media(max-width:700px){.about,.two{grid-template-columns:1fr}.deco{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--matcha-d);outline-offset:3px}
</style>
</head>

  read:L("Đọc bài","Read article","Lire l'article"),watch:L("Xem video","Watch video","Voir la vidéo"),view:L("Xem thêm","View","Voir"),
  addPhoto:L("Thêm ảnh chân dung\n(CONFIG.photo)","Add your portrait\n(CONFIG.photo)","Ajoutez votre portrait\n(CONFIG.photo)"),
  addVideo:L("Chưa có video — thêm vào CONFIG.videos","No videos yet — add them in CONFIG.videos","Pas encore de vidéo — ajoutez-les dans CONFIG.videos"),
  contactTxt:L("Rất vui được kết nối và trao đổi cùng bạn.","I'd love to connect and talk with you.","Au plaisir d'échanger avec vous.")
};

/* =====================================================================
   2) ENGINE — no need to edit below
   ===================================================================== */
let lang="vi",tab="about";
try{lang=localStorage.getItem("lang")||"vi"}catch(e){}
const $=s=>document.querySelector(s), tx=o=>(o&&o[lang])||"";
const img=(src,cls,alt="")=>src?`<img class="${cls}" src="${src}" alt="${alt}" loading="lazy">`:"";
const ph=(txt,cls="")=>`<div class="ph ${cls}" style="white-space:pre-line">${txt}</div>`;

function ytEmbed(u){const m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?`https://www.youtube.com/embed/${m[1]}`:""}

const R={
 about:()=>`<div class="about">
   ${CONFIG.photo?img(CONFIG.photo,"photo fade","Portrait"):ph(tx(UI.addPhoto),"photo fade")}
   <div class="txt"><h2>${tx(UI.tabs.about)}</h2>${CONFIG.about.map(p=>`<p>${tx(p)}</p>`).join("")}
   <h3 class="meta" style="margin-top:14px">${tx(UI.skills)}</h3><div class="chips">${CONFIG.skills.map(s=>`<span>${tx(s)}</span>`).join("")}</div></div></div>
  <div class="two"><div><h2>${tx(UI.edu)}</h2>${CONFIG.education.map(e=>`<div class="card"><h3>${tx(e.t)}</h3><div class="meta">${tx(e.o)} · ${e.p}</div></div>`).join("")}</div>
  <div><h2>${tx(UI.lang)}</h2><div class="card"><div class="chips">${CONFIG.languages.map(s=>`<span>${tx(s)}</span>`).join("")}</div></div></div></div>`,
 experience:()=>`<h2>${tx(UI.tabs.experience)}</h2>`+CONFIG.experience.map(e=>`<div class="card">${img(e.img,"thumb fadeb")}<h3>${tx(e.role)}</h3><div class="meta">${tx(e.org)} · ${e.period}</div><p>${tx(e.desc)}</p>${e.link?`<a class="btn" href="${e.link}" target="_blank" rel="noopener">${tx(UI.view)}</a>`:""}</div>`).join(""),
 articles:()=>`<h2>${tx(UI.tabs.articles)}</h2><div class="grid">`+CONFIG.articles.map(a=>`<div class="card">${a.img?img(a.img,"thumb fadeb"):""}<div class="body" ${a.img?"":'style="padding-top:22px"'}><div class="meta">${a.src||""}</div><h3>${a.title}</h3><a class="btn" href="${a.url}" target="_blank" rel="noopener">${tx(UI.read)}</a></div></div>`).join("")+`</div>`,
 videos:()=>`<h2>${tx(UI.tabs.videos)}</h2>`+(CONFIG.videos.length?`<div class="grid">`+CONFIG.videos.map(v=>{const e=ytEmbed(v.url);return `<div class="card">${e?`<iframe class="video" src="${e}" allowfullscreen loading="lazy" title="video"></iframe>`:img(v.img,"thumb fadeb")}<div class="body"><h3>${tx(v.title)}</h3>${e?"":`<a class="btn" href="${v.url}" target="_blank" rel="noopener">${tx(UI.watch)}</a>`}</div></div>`}).join("")+`</div>`:ph(tx(UI.addVideo))),
 projects:()=>`<h2>${tx(UI.tabs.projects)}</h2>`+CONFIG.projects.map(p=>`<div class="card">${img(p.img,"thumb fadeb")}<h3>${tx(typeof p.t==="string"?{[lang]:p.t}:p.t)}</h3><div class="meta">${tx(p.role)} · ${p.p}</div><p>${tx(p.d)}</p>${p.link?`<a class="btn" href="${p.link}" target="_blank" rel="noopener">${tx(UI.view)}</a>`:""}</div>`).join(""),
 awards:()=>`<h2>${tx(UI.tabs.awards)}</h2>`+CONFIG.awards.map(a=>`<div class="card"><h3>${tx(a.t)}</h3><p>${tx(a.n)}</p>${a.url?`<a class="btn" href="${a.url}" target="_blank" rel="noopener">${tx(UI.view)}</a>`:""}</div>`).join(""),
 contact:()=>`<h2>${tx(UI.tabs.contact)}</h2><div class="card"><p style="font-size:1.05rem;color:var(--ink)">${tx(UI.contactTxt)}</p><a class="btn" href="mailto:${CONFIG.email}">${CONFIG.email}</a> <a class="btn" href="${CONFIG.linkedin}" target="_blank" rel="noopener">LinkedIn</a></div>`
};

function build(){
  document.documentElement.lang=lang;
  $("#tagline").textContent=tx(CONFIG.tagline);
  $("#lang").innerHTML=["vi","en","fr"].map(l=>`<button class="${l===lang?"on":""}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
  $("#nav").innerHTML=Object.keys(R).map(k=>`<button class="${k===tab?"on":""}" data-t="${k}">${tx(UI.tabs[k])}</button>`).join("");
  $("#stage").innerHTML=Object.keys(R).map(k=>`<section class="panel ${k===tab?"show in":""}" id="p-${k}">${R[k]()}</section>`).join("");
  const bg=$("#bgimg");if(CONFIG.bgImage){bg.src=CONFIG.bgImage;bg.hidden=false}
  if(CONFIG.decoImage&&!$(".deco")){document.body.insertAdjacentHTML("afterbegin",`<img class="deco fade" src="${CONFIG.decoImage}" alt="">`)}
}
function go(k){
  if(k===tab)return;
  const cur=$("#p-"+tab),nx=$("#p-"+k);tab=k;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===k));
  cur.classList.remove("in");
  setTimeout(()=>{cur.classList.remove("show");nx.classList.add("show");requestAnimationFrame(()=>requestAnimationFrame(()=>nx.classList.add("in")))},320);
}
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]"),t=e.target.closest("[data-t]");
  if(l){lang=l.dataset.l;try{localStorage.setItem("lang",lang)}catch(x){}build()}
  if(t)go(t.dataset.t);
});
build();
</script>
</body>
</html>
